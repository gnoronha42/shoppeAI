name: 🔄 Refresh Shopee Tokens

on:
  schedule:
    # Executa a cada 3 horas: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
    - cron: '0 */3 * * *'
  
  # Permite execução manual do workflow
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Forçar refresh de todos os tokens'
        required: false
        default: 'false'
        type: boolean

jobs:
  refresh-tokens:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Refresh Shopee Tokens
        run: |
          echo "🚀 Iniciando refresh de tokens Shopee..."
          echo "⏰ Horário: $(date)"
          echo "🌐 URL: ${{ secrets.APPURL }}"
          
          # Verificar se APPURL está configurado
          if [ -z "${{ secrets.APPURL }}" ]; then
            echo "❌ ERRO: Secret APPURL não configurado!"
            echo "🔧 Configure em: Settings → Secrets → Actions → New repository secret"
            echo "📝 Name: APPURL"
            echo "📝 Value: https://seu-dominio.com (sem barra no final)"
            exit 1
          fi
          
          # Fazer chamada para o endpoint de refresh
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -X GET "${{ secrets.APPURL }}/api/shopee/cron-refresh-tokens" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Cron/1.0")
          
          # Extrair código HTTP
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_CODE:/d')
          
          echo "📊 Resposta do servidor:"
          echo "$body" | jq . 2>/dev/null || echo "$body"
          
          echo "🔍 Status HTTP: $http_code"
          
          # Verificar se foi bem-sucedido
          if [ "$http_code" = "200" ]; then
            # Extrair informações do resumo
            total_checked=$(echo "$body" | jq -r '.summary.total_checked // 0')
            successful_refreshes=$(echo "$body" | jq -r '.summary.successful_refreshes // 0')
            failed_refreshes=$(echo "$body" | jq -r '.summary.failed_refreshes // 0')
            skipped=$(echo "$body" | jq -r '.summary.skipped // 0')
            
            echo ""
            echo "📊 Resumo do Processamento:"
            echo "   🔍 Total verificado: $total_checked"
            echo "   ✅ Sucessos: $successful_refreshes"
            echo "   ❌ Falhas: $failed_refreshes"
            echo "   ⏭️  Pulados: $skipped"
            
            # Verificar se houve erros no JSON de resposta
            if echo "$body" | jq -e '.success == false' >/dev/null 2>&1; then
              echo ""
              echo "⚠️ Refresh executado mas com alguns erros:"
              echo "$body" | jq -r '.summary.errors[]?' 2>/dev/null || echo "Detalhes não disponíveis"
              
              # Verificar se os erros são apenas de refresh tokens expirados ou não encontrados (situação esperada)
              all_errors_are_expired=$(echo "$body" | jq -r '.summary.details[]?.error // empty' 2>/dev/null | grep -ic "error_not_found\|REFRESH_TOKEN_EXPIRED\|REFRESH_TOKEN_NOT_FOUND\|não encontrado\|404.*refresh\|refresh.*404" || echo "0")
              total_errors=$(echo "$body" | jq -r '.summary.failed_refreshes // 0')
              
              if [ "$all_errors_are_expired" = "$total_errors" ] && [ "$total_errors" -gt 0 ]; then
                echo ""
                echo "ℹ️ Todos os erros são de refresh tokens expirados (situação esperada)"
                echo "   As contas precisam ser reconectadas manualmente"
                echo "   Isso NÃO é um erro crítico do sistema"
                # Não falhar o workflow neste caso
              else
                echo ""
                echo "❌ Erros críticos encontrados - falhando o workflow"
                exit 1
              fi
            fi
            
            # Se total_checked é 0, pode ser normal (não há tokens para renovar)
            if [ "$total_checked" = "0" ]; then
              echo ""
              echo "ℹ️ Nenhuma integração encontrada para renovar."
              echo "   Isso é normal se:"
              echo "   - Não há integrações Shopee conectadas"
              echo "   - Todos os tokens são válidos por mais de 6 horas"
              echo "   - As integrações não têm refresh_token válido"
              echo ""
              echo "💡 Dica: Execute GET /api/shopee/diagnose-tokens para ver o status detalhado"
            elif [ "$failed_refreshes" -gt 0 ] && [ "$successful_refreshes" -eq 0 ]; then
              # Verificar se todos os erros são de tokens expirados ou não encontrados
              expired_count=$(echo "$body" | jq -r '[.summary.details[]? | select(.error | test("error_not_found|REFRESH_TOKEN_EXPIRED|REFRESH_TOKEN_NOT_FOUND|não encontrado|404.*refresh|refresh.*404"; "i"))] | length' 2>/dev/null || echo "0")
              if [ "$expired_count" = "$failed_refreshes" ]; then
                echo ""
                echo "⚠️ Todas as integrações têm refresh tokens expirados"
                echo "   Isso é esperado após ~30 dias sem uso"
                echo "   As contas precisam ser reconectadas manualmente"
                echo "   O sistema está funcionando corretamente ✅"
              else
                echo ""
                echo "✅ Refresh executado (alguns tokens renovados, alguns falharam)"
              fi
            else
              echo ""
              echo "✅ Refresh executado com sucesso!"
            fi
          else
            echo "❌ Falha no refresh! Status: $http_code"
            echo "Resposta: $body"
            exit 1
          fi

      - name: 📊 Log Summary
        if: always()
        run: |
          echo "📋 Resumo da execução:"
          echo "⏰ Executado em: $(date)"
          echo "🔄 Próxima execução: $(date -d '+3 hours')"
          echo "📍 Timezone: UTC"
          echo "🌐 Endpoint: ${{ secrets.APPURL }}/api/shopee/cron-refresh-tokens"

      - name: 🚨 Notify on Failure
        if: failure()
        run: |
          echo "🚨 ATENÇÃO: Falha no refresh de tokens!"
          echo "🔧 Ações recomendadas:"
          echo "   1. Verificar se a aplicação está online"
          echo "   2. Verificar logs da aplicação"
          echo "   3. Executar diagnóstico manual: GET /api/shopee/diagnose-tokens"
          echo "   4. Se necessário, reautenticar contas manualmente"
